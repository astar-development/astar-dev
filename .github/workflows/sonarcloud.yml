name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**/*.cs'
      - 'apps/**/*.csproj'
      - 'apps/**/*.axaml'
      - 'apps/**/*.razor'
      - 'nuget-packages/**/*.cs'
      - 'nuget-packages/**/*.csproj'
      - 'AStarDev.slnx'
      - 'global.json'
      - 'local-setup.md'
      - '.github/workflows/sonarcloud.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/**/*.cs'
      - 'apps/**/*.csproj'
      - 'apps/**/*.axaml'
      - 'apps/**/*.razor'
      - 'nuget-packages/**/*.cs'
      - 'nuget-packages/**/*.csproj'
      - 'AStarDev.slnx'
      - 'global.json'
      - 'local-setup.md'
      - '.github/workflows/sonarcloud.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  SONAR_PROJECT_KEY: 'astar-development_astar-dev-mono'
  SONAR_ORG: 'astar-development'

jobs:
  build-and-analyze:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - name: 🛠 Set up JDK
        uses: actions/setup-java@v6.0.0
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛠 Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠 Cache SonarQube Cloud packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 🛠 Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v6.1.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: 🛠 Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: 🛠 Dotnet Restore
        run: dotnet restore

      - name: 🔍 Begin ☁️ SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/**/*.cobertura.xml" \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.scanner.skipJreProvisioning=true

      - name: 🛠 Build
        run: |
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:TreatWarningsAsErrors=true

      - name: 🛠 Install dotnet-coverage
        run: dotnet tool install -g dotnet-coverage

      - name: 🧪 Test & collect coverage (per project)
        run: |
          mkdir -p TestResults

          mapfile -t projects < <(find . -name '*.Tests*.csproj' ! -name '*.TestsIntegration.csproj')

          for proj in "${projects[@]}"; do
            proj_name=$(basename "$proj" .csproj)
            echo "Running tests & coverage for $proj"

            dotnet-coverage collect \
              "dotnet test --project \"$proj\" --no-build --configuration Release" \
              -f cobertura \
              -o "TestResults/$proj_name.cobertura.xml"
          done

      - name: 🏁 End ☁️ SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
